[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nansen-core"
version = "0.1.0"
description = "NANSEN core: versioned project, fragment and table documents, shared by the MATLAB and Python implementations"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = [
    "jsonschema>=4.17",
    "dataset-structure-model @ git+https://github.com/framover/dataset-structure-model@claude/nansen-core-rebuild-jl86j3",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]
mat = ["scipy>=1.7"]
npy = ["numpy>=1.20"]
ophys = ["numpy>=1.20", "tifffile>=2021.1"]
hdf5 = ["h5py>=3.0", "numpy>=1.20"]
video = ["numpy>=1.20", "imageio>=2.9", "imageio-ffmpeg>=0.4"]

[project.scripts]
nansen = "nansen.cli:main"

[project.urls]
Homepage = "https://github.com/ehennestad/nansen-core"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["python/src/nansen"]

[tool.hatch.build.targets.wheel.force-include]
"schema" = "nansen/schemas"
"modules" = "nansen/builtin_modules"
"ui" = "nansen/ui"
"templates" = "nansen/templates"

[tool.hatch.build.targets.sdist]
include = ["python", "schema", "modules", "ui", "templates", "conformance", "docs", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
