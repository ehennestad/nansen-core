[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nansen-core"
version = "0.1.0"
description = "NANSEN core: versioned project, fragment and table documents, shared by the MATLAB and Python implementations"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = ["jsonschema>=4.17"]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
nansen = "nansen.cli:main"

[project.urls]
Homepage = "https://github.com/ehennestad/nansen-core"

[tool.hatch.build.targets.wheel]
packages = ["python/src/nansen"]

[tool.hatch.build.targets.wheel.force-include]
"schema" = "nansen/schemas"

[tool.hatch.build.targets.sdist]
include = ["python", "schema", "conformance", "docs", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
