name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Run by hand too, e.g. after a change on the DSM branch the MATLAB job checks out
  workflow_dispatch:

jobs:
  python:
    name: Python tests and conformance
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: pip install -e ".[test,mat,npy,ophys,hdf5,video,excel]"

      - name: Check the core keeps no global state
        run: python tools/check_no_global_state.py

      - name: Run the test suite
        run: pytest -v

      - name: Run the conformance cases
        run: nansen conformance -v

  ui:
    name: Dashboard in a browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package, Playwright and Chromium
        run: |
          pip install -e ".[test,ophys]" playwright
          python -m playwright install --with-deps chromium

      - name: Check the frontend scripts parse
        run: for f in ui/js/*.js; do node --check "$f"; done

      - name: Run the browser tests
        run: pytest -v python/tests/test_ui.py python/tests/test_server.py

  matlab:
    name: MATLAB tests and conformance (${{ matrix.release }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # R2023a does not support Ubuntu 24.04 (ubuntu-latest). On either Ubuntu its uihtml runs no
          # page in a CI session, not even a minimal one, so the app test is incomplete there (see ApiTest).
          - release: R2023a
            os: ubuntu-22.04
          - release: latest
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out the DSM reader
        uses: actions/checkout@v4
        with:
          repository: framover/dataset-structure-model
          ref: claude/nansen-core-rebuild-jl86j3
          path: dsm

      - uses: matlab-actions/setup-matlab@v2
        with:
          release: ${{ matrix.release }}

      - name: Start a virtual display, so the app test can show the dashboard
        run: |
          sudo apt-get install -y -q xvfb > /dev/null
          Xvfb :99 -screen 0 1600x1000x24 > /dev/null 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Run the MATLAB suite (unit tests and every conformance case)
        uses: matlab-actions/run-command@v2
        with:
          command: addpath("matlab"); runNansenCoreTests();

      - name: Run the DSM reader's own MATLAB suite (its CI runs only for main)
        if: ${{ !cancelled() }}
        uses: matlab-actions/run-command@v2
        with:
          command: addpath("dsm/src/matlab"); runMatlabTests();

  python-tools:
    name: External tools (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the package, suite2p (with CPU torch and torchvision, built together) and DeepInterpolation
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install -e ".[test,npy,ophys]" suite2p tensorflow-cpu h5py pynwb "git+https://github.com/AllenInstitute/deepinterpolation"

      - name: Run the wrappers with the real tools
        env:
          NANSEN_REQUIRE_TOOLS: suite2p,deepinterpolation,tensorflow,pynwb
        run: pytest -v -rs python/tests/test_external_tools.py -k "suite2p or deep_interpolation or nwb"

  caiman-tools:
    name: External tools (CaImAn)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: caiman
          create-args: python=3.11 caiman
          condarc: |
            channels:
              - conda-forge

      - name: Install the package
        run: pip install -e ".[test,npy,ophys]"

      - name: Run the wrapper with CaImAn
        env:
          NANSEN_REQUIRE_TOOLS: caiman
        run: pytest -v -rs python/tests/test_external_tools.py -k caiman

  matlab-tools:
    name: External tools (MATLAB ${{ matrix.release }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # R2024b is the last release with Java figures, which dev's imviewer needs
        release: [R2024b, latest]
    steps:
      - uses: actions/checkout@v4

      - name: Check out the DSM reader
        uses: actions/checkout@v4
        with:
          repository: framover/dataset-structure-model
          ref: claude/nansen-core-rebuild-jl86j3
          path: dsm

      - name: Clone NoRMCorre, CaImAn-MATLAB, EXTRACT, Flow-Registration, matnwb and NANSEN dev (for imviewer)
        run: |
          mkdir external-tools
          for repo in flatironinstitute/NoRMCorre flatironinstitute/CaImAn-MATLAB schnitzer-lab/EXTRACT-public FlowRegSuite/flow_registration VervaekeLab/NANSEN NeurodataWithoutBorders/matnwb; do
            git clone -q --depth 1 "https://github.com/$repo" "external-tools/$(basename "$repo")"
          done
          # imviewer's community dependency: the Widgets Toolbox version dev's nansen.setup installs
          curl -sSfL -o widgets.zip "https://www.mathworks.com/matlabcentral/mlc-downloads/downloads/b0bebf59-856a-4068-9d9c-0ed8968ac9e6/099f0a4d-9837-4e5f-b3df-aa7d4ec9c9c9/packages/zip"
          unzip -q widgets.zip -d external-tools/widgets-toolbox
          find external-tools/widgets-toolbox -maxdepth 3 -type d | head -20

      - uses: matlab-actions/setup-matlab@v2
        with:
          release: ${{ matrix.release }}
          products: >
            Image_Processing_Toolbox
            Signal_Processing_Toolbox
            Statistics_and_Machine_Learning_Toolbox
            Parallel_Computing_Toolbox
            Bioinformatics_Toolbox
            Econometrics_Toolbox
            Wavelet_Toolbox

      - name: Start a virtual display, for imviewer
        run: |
          sudo apt-get install -y -q xvfb > /dev/null
          Xvfb :99 -screen 0 1600x1000x24 > /dev/null 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Run the wrappers with the real tools
        uses: matlab-actions/run-command@v2
        with:
          command: addpath("matlab"); runExternalToolTests("external-tools");
