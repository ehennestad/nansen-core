name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Run by hand too, e.g. after a change on the DSM branch the MATLAB job checks out
  workflow_dispatch:

jobs:
  python:
    name: Python tests and conformance
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: pip install -e ".[test,mat,npy,ophys]"

      - name: Check the core keeps no global state
        run: python tools/check_no_global_state.py

      - name: Run the test suite
        run: pytest -v

      - name: Run the conformance cases
        run: nansen conformance -v

  ui:
    name: Dashboard in a browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package, Playwright and Chromium
        run: |
          pip install -e ".[test]" playwright
          python -m playwright install --with-deps chromium

      - name: Check the frontend scripts parse
        run: for f in ui/js/*.js; do node --check "$f"; done

      - name: Run the browser tests
        run: pytest -v python/tests/test_ui.py python/tests/test_server.py

  matlab:
    name: MATLAB tests and conformance (${{ matrix.release }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # R2023a does not support Ubuntu 24.04 (ubuntu-latest). On either Ubuntu its uihtml runs no
          # page in a CI session, not even a minimal one, so the app test is incomplete there (see ApiTest).
          - release: R2023a
            os: ubuntu-22.04
          - release: latest
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out the DSM reader
        uses: actions/checkout@v4
        with:
          repository: framover/dataset-structure-model
          ref: claude/nansen-core-rebuild-jl86j3
          path: dsm

      - uses: matlab-actions/setup-matlab@v2
        with:
          release: ${{ matrix.release }}

      - name: Start a virtual display, so the app test can show the dashboard
        run: |
          sudo apt-get install -y -q xvfb > /dev/null
          Xvfb :99 -screen 0 1600x1000x24 > /dev/null 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Run the MATLAB suite (unit tests and every conformance case)
        uses: matlab-actions/run-command@v2
        with:
          command: addpath("matlab"); runNansenCoreTests();

      - name: Run the DSM reader's own MATLAB suite (its CI runs only for main)
        if: ${{ !cancelled() }}
        uses: matlab-actions/run-command@v2
        with:
          command: addpath("dsm/src/matlab"); runMatlabTests();
